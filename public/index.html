<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Peereira7-CASTR | Stats LoL</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0b1220; color:#e5e7eb; margin:0; }
    header { background:#111827; padding:20px; }
    h1 { margin:0; font-size: 42px; }
    header p { margin: 8px 0 0; color:#9ca3af; }
    .container { padding:20px; max-width: 1100px; margin: 0 auto; }
    .card { background:#111827; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
    h2 { margin: 0 0 10px; }
    .muted { color:#9ca3af; }
    .error { background:#3f1d1d; border:1px solid #7f1d1d; color:#fecaca; padding:12px; border-radius:10px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:10px; border-bottom:1px solid #1f2937; text-align:center; }
    th { color:#9ca3af; font-weight: 600; }
    .win { color:#22c55e; font-weight: 700; }
    .lose { color:#ef4444; font-weight: 700; }
    .champCell { text-align:left; }
    .champWrap { display:flex; align-items:center; gap:10px; justify-content:flex-start; }
    .champIcon { width:36px; height:36px; border-radius:10px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
    .rankTier{
    color:#a855f7; /* morado master */
    font-weight:800;
    font-size:18px;
    }
    .winrate{
    margin-left:6px;
    font-weight:600;
    color:#94a3b8;
}
.winrate-good{
  color:#22c55e; /* verde */
  font-weight:700;
}

.winrate-bad{
  color:#ef4444; /* rojo */
  font-weight:700;
}
.champList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.champRow{
  display:grid;
  grid-template-columns: 44px 1fr 120px 90px 90px;
  gap:12px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:#0f172a;
  border:1px solid #1f2937;
}

.champRow .name{
  font-weight:800;
}

.champRow .sub{
  color:#9ca3af;
  font-size:12px;
  margin-top:2px;
}

.stat{
  text-align:right;
  font-weight:700;
}

.stat small{
  display:block;
  color:#94a3b8;
  font-weight:600;
  margin-top:2px;
}

.wrGood{ color:#22c55e; }
.wrBad{ color:#ef4444; }
/* Botones para cambiar de página */
.pagerBtn{
  min-width:44px;
  height:44px;
  border:none;
  border-radius:8px;
  background:#374151;
  color:#e5e7eb;
  font-weight:800;
  cursor:pointer;
}
.pagerBtn:hover{ filter:brightness(1.1); }
.pagerBtn.active{
  background:#7c3aed; /* morado */
}
.pagerBtn.ghost{
  background:transparent;
  border:1px solid #374151;
  color:#9ca3af;
  cursor:default;
}
.grid{
  display:grid;
  grid-template-columns: 1fr 320px;
  gap:16px;
  align-items:start;
}

@media (max-width: 1000px){
  .grid{ grid-template-columns: 1fr; }
}

.side{
  background:#111827;
  border-radius:14px;
  overflow:hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
  border:1px solid #1f2937;
}

.sideHeader{
  padding:14px 16px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-size:12px;
  color:#cbd5e1;
  background: linear-gradient(90deg, rgba(124,58,237,.35), rgba(17,24,39,0));
  border-bottom:1px solid #1f2937;
}

.sideList{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sideRow{
  display:grid;
  grid-template-columns: 44px 1fr auto;
  gap:12px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:#0f172a;
  border:1px solid #1f2937;
}

.sideRow .name{
  font-weight:900;
  font-size:14px;
  margin-bottom:4px;
}

.sideRow .kda{
  color:#9ca3af;
  font-weight:700;
  font-size:12px;
}

.sideRight{
  text-align:right;
  min-width:90px;
}

.sideRight .wr{
  font-weight:900;
  font-size:14px;
}

.sideRight .wl{
  color:#9ca3af;
  font-weight:700;
  font-size:12px;
  margin-top:4px;
}

.sideMore{
  width:100%;
  border:none;
  padding:12px 0;
  background:#0b1220;
  color:#e5e7eb;
  font-weight:900;
  cursor:pointer;
  border-top:1px solid #1f2937;
}
.sideMore:hover{ filter:brightness(1.1); }
/* ===== Profile Header (OP.GG style) ===== */
.profileHeader{
  display:flex;
  align-items:center;
  gap:16px;
  padding:18px;
  border-radius:16px;
  background: linear-gradient(180deg, rgba(17,24,39,0.9), rgba(15,23,42,0.95));
  border:1px solid #1f2937;
  box-shadow: 0 10px 26px rgba(0,0,0,.28);
  margin-bottom:16px;
}

.profileIcon{
  width:86px;
  height:86px;
  border-radius:18px;
  overflow:hidden;
  background:#0f172a;
  border:1px solid #1f2937;
  box-shadow: 0 8px 20px rgba(0,0,0,.35);
  flex:0 0 auto;
}
.profileIcon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.profileMain{
  flex:1;
  min-width:0;
}

.profileNameRow{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.profileName{
  font-size:34px;
  font-weight:900;
  margin:0;
  line-height:1.05;
}

.profileTag{
  padding:6px 10px;
  border-radius:10px;
  background:#0f172a;
  border:1px solid #1f2937;
  color:#cbd5e1;
  font-weight:800;
  letter-spacing:.02em;
}

.profileMeta{
  margin-top:8px;
  display:flex;
  gap:10px;
  align-items:center;
  color:#94a3b8;
  font-weight:700;
  font-size:12px;
}
.dot{
  width:6px;
  height:6px;
  border-radius:999px;
  background:#7c3aed;
  display:inline-block;
}

.profileActions{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.btnPrimary{
  border:none;
  background:#7c3aed;
  color:white;
  font-weight:900;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  box-shadow: 0 10px 20px rgba(124,58,237,.25);
}
.btnPrimary:hover{ filter:brightness(1.08); }

.btnGhost{
  border:1px solid #374151;
  background:transparent;
  color:#cbd5e1;
  font-weight:900;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
}
.btnGhost:hover{ filter:brightness(1.08); }


  </style>
</head>
<body>
<header>
  <h1>Peereira7-CASTR</h1>
  <p>EUW · SoloQ Stats (mini OP.GG)</p>
</header>

<div class="container">
  <div class="profileHeader">
  <div class="profileIcon">
    <img id="profileIconImg" src="" alt="Profile Icon" />
  </div>

  <div class="profileMain">
    <div class="profileNameRow">
      <h2 id="profileName" class="profileName">Cargando...</h2>
      <span id="profileTag" class="profileTag">#...</span>
    </div>
    <div class="profileMeta">
      <span class="dot"></span>
      <span id="lastSyncText">LAST SYNC: —</span>
    </div>
  </div>

  <div class="profileActions">
    <button id="syncBtn" class="btnPrimary">UPDATE PROFILE</button>
  </div>
</div>


  <div class="card" id="rankCard">
    <h2>Rank</h2>
    <div id="rank" class="muted">Cargando…</div>
</div>

<div class="grid">
  <div class="card" id="matchesCard">
    <h2>Partidas recientes</h2>

    <table id="matches">
      <thead>
        <tr>
          <th>#</th>
          <th style="text-align:left;">Campeón</th>
          <th>K / D / A</th>
          <th>KDA</th>
          <th>Resultado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    
    <div id="pagination" style="display:flex;gap:8px;justify-content:center;margin-top:14px;"></div>
  </div>

  <div class="side">
    <div class="sideHeader">⭐ CHAMPIONS PLAYED</div>
    <div id="champSideList" class="sideList"></div>
    <button id="champShowMore" class="sideMore">Show more</button>
  </div>
</div>

<script>
  // 👉 Importante: como lo abres desde http://localhost:3001
  // usamos rutas relativas al backend:
  const API = "/api";

  // ===== DDRAGON (iconos) =====
  let DDRAGON_VERSION = null;

  async function getDdragonVersion() {
    if (DDRAGON_VERSION) return DDRAGON_VERSION;
    const versions = await fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r => r.json());
    DDRAGON_VERSION = versions[0];
    return DDRAGON_VERSION;
  }

  const CHAMPION_FILE_FIX = {
    FiddleSticks: "Fiddlesticks",
    MonkeyKing: "Wukong",
    KhaZix: "Khazix",
    ChoGath: "Chogath",
    LeBlanc: "Leblanc",
    KaiSa: "Kaisa",
    VelKoz: "Velkoz",
    BelVeth: "Belveth",
  };

  function championIconUrl(name) {
    const file = CHAMPION_FILE_FIX[name] || name;
    return `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/champion/${file}.png`;
  }

  function kdaValue(k, d, a) {
    return (k + a) / Math.max(1, d);
  }
  function fmt(n) { return Number(n).toFixed(2); }

  function showError(message) {
  console.error(message);
  alert(message);
}


  let currentPage = 1;
  const pageSize = 5;

  function renderPagination(totalPages) {
    const el = document.getElementById("pagination");
    if (!el) return;

    const buttons = [];

    const addBtn = (label, page, active=false, disabled=false, ghost=false) => {
      const cls = `pagerBtn ${active ? "active" : ""} ${ghost ? "ghost" : ""}`.trim();
      buttons.push({ label, page, cls, disabled });
    };

    // lógica tipo "1 2 3 ... last"
    if (totalPages <= 6) {
      for (let p = 1; p <= totalPages; p++) addBtn(String(p), p, p === currentPage);
    } else {
      addBtn("1", 1, currentPage === 1);
      addBtn("2", 2, currentPage === 2);
      addBtn("3", 3, currentPage === 3);

      if (currentPage > 4 && currentPage < totalPages - 2) {
        addBtn("…", null, false, true, true);
        addBtn(String(currentPage), currentPage, true);
        addBtn("…", null, false, true, true);
      } else {
        addBtn("…", null, false, true, true);
      }

      addBtn(String(totalPages), totalPages, currentPage === totalPages);
    }

    el.innerHTML = buttons.map(b => {
      if (b.disabled) return `<button class="${b.cls}" disabled>${b.label}</button>`;
      return `<button class="${b.cls}" data-page="${b.page}">${b.label}</button>`;
    }).join("");

    el.querySelectorAll("button[data-page]").forEach(btn => {
      btn.addEventListener("click", async () => {
        currentPage = Number(btn.dataset.page);
        await loadMatchesFromDb(currentPage);
      });
    });
  }

  async function loadMatchesFromDb(page=1) {
    const res = await fetch(`${API}/db/matches/paged?page=${page}&pageSize=${pageSize}&days=5`);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "Error cargando partidas de BD");

    const tbody = document.querySelector("#matches tbody");
    tbody.innerHTML = "";

    data.rows.forEach((m, idx) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="muted small">${(page-1)*pageSize + idx + 1}</td>
        <td class="champCell">
          <div class="champWrap">
            <img class="champIcon" src="${championIconUrl(m.championName)}" alt="${m.championName}" onerror="this.style.display='none';" />
            <span style="font-weight:700;">${m.championName}</span>
          </div>
        </td>
        <td>${m.kills}/${m.deaths}/${m.assists}</td>
        <td>${fmt(kdaValue(m.kills, m.deaths, m.assists))}</td>
        <td class="${m.win ? "win" : "lose"}">${m.win ? "Victoria" : "Derrota"}</td>
      `;
      tbody.appendChild(tr);
    });

    renderPagination(data.totalPages);
  }
 let champSideLimit = 5;

async function loadChampionsSide() {
  const res = await fetch(`${API}/db/champions?days=5&limit=${champSideLimit}`);
  const champs = await res.json();
  if (!res.ok || champs.error) throw new Error(champs.error || "Error cargando campeones (DB)");

  const el = document.getElementById("champSideList");
  if (!el) return;

  if (!champs.length) {
    el.innerHTML = `<div class="muted" style="padding:10px;">Sin datos. Ejecuta /api/sync</div>`;
    return;
  }

  el.innerHTML = champs.map(c => {
    const wrClass = c.wr >= 50 ? "wrGood" : "wrBad";
    return `
      <div class="sideRow">
        <img class="champIcon" src="${championIconUrl(c.championName)}" alt="${c.championName}" onerror="this.style.display='none';">
        <div>
          <div class="name">${c.championName}</div>
          <div class="kda">${c.kda}:1 KDA</div>
        </div>
        <div class="sideRight">
          <div class="wr ${wrClass}">${c.wr}%</div>
          <div class="wl">${c.wins}W - ${c.losses}L</div>
        </div>
      </div>
    `;
  }).join("");
}


document.addEventListener("click", async (e) => {
  if (e.target && e.target.id === "champShowMore") {
    champSideLimit = Math.min(20, champSideLimit + 5);
    await loadChampionsSide();
  }
});

  function timeAgo(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  const d = Math.floor(h / 24);
  if (d > 0) return `${d} day${d>1?"s":""} ago`;
  if (h > 0) return `${h} hour${h>1?"s":""} ago`;
  if (m > 0) return `${m} minute${m>1?"s":""} ago`;
  return `just now`;
}

// ✅ ESTA FUNCIÓN VA AQUÍ: FUERA, DEBAJO DE timeAgo()
async function loadLastSync() {
  const res = await fetch(`${API}/db/last-sync`);
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || "Error cargando last sync");

  const el = document.getElementById("lastSyncText");
  if (!el) return;

  if (!data.lastSync) {
    el.textContent = "LAST SYNC: —";
    return;
  }

  const diff = Date.now() - data.lastSync;
  el.textContent = `LAST SYNC: ${timeAgo(diff)}`;
}


  async function load() {
    try {
      await getDdragonVersion();

      // 1) PUUID
      const accRes = await fetch(`${API}/summoner`);
      const acc = await accRes.json();
      console.log("ACC:", acc);
      console.log("DDRAGON_VERSION:", DDRAGON_VERSION);

      const img = document.getElementById("profileIconImg");
      console.log("IMG TAG:", img);

      const iconId = acc.profileIconId;
      console.log("profileIconId:", iconId);

      img.src = `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/profileicon/${iconId}.png`;
      img.onerror = () => console.log("❌ Icon 404:", img.src);

      // ===== Profile Header data =====
      document.getElementById("profileName").textContent = acc.gameName;
      document.getElementById("profileTag").textContent = `#${acc.tagLine}`;

      // Icono “bonito” (como no tenemos el icono real de summoner, usamos un fallback)
      // Puedes cambiar esta URL por una imagen tuya si quieres
      const iconUrl = `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/profileicon/${acc.profileIconId}.png`;
      document.getElementById("profileIconImg").src = 
        `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VERSION}/img/profileicon/1.png`;

      if (!accRes.ok || acc.error) throw new Error(acc.error || "Error en /api/summoner");

      const puuid = acc.puuid;

      const rankEl = document.getElementById("rank");
      // 2) Rank por PUUID
    const rankRes = await fetch(`${API}/rank/by-puuid/${puuid}`);
    const rank = await rankRes.json();
    if (!rankRes.ok || rank.error) throw new Error(rank.error || "Error en /api/rank/by-puuid");

    const soloq = rank.find(r => r.queueType === "RANKED_SOLO_5x5");

    if (!soloq) {
    rankEl.innerHTML = `<span class="muted">Sin rank en SoloQ</span>`;
    return;
    }

    const total = soloq.wins + soloq.losses;
    const wr = total ? Math.round((soloq.wins / total) * 100) : 0;

    const wrClass = wr >= 50 ? "winrate-good" : "winrate-bad";

    rankEl.innerHTML = `
    <div class="rankTier">
        ${soloq.tier} ${soloq.rank} · ${soloq.leaguePoints} LP
    </div>
    <div class="muted small">
        ${soloq.wins}W / ${soloq.losses}L
        <span class="${wrClass}">· WR ${wr}%</span>
    </div>
    `;
      // 3) Matches desde BASE DE DATOS (con paginación)
      await loadMatchesFromDb(1);
      await loadChampionsSide();
    // LAST SYNC (simple: usamos "ahora" cuando carga bien)
      await loadLastSync();


    } catch (e) {
      showError(e.message);
      console.error(e);
    }
  }

document.getElementById("syncBtn").addEventListener("click", async () => {
  try {
    document.getElementById("lastSyncText").textContent = "LAST SYNC: syncing...";
    const r = await fetch(`${API}/sync`);
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || "Sync failed");

    // recargar datos
    currentPage = 1;
    await loadMatchesFromDb(1);
    await loadChampionsSide();
    await loadLastSync();


  } catch (e) {
    document.getElementById("lastSyncText").textContent = "LAST SYNC: error";
    showError(e.message);
  }
});

  load();
</script>
</body>
</html>
